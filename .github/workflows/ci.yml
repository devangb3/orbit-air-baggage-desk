# STRETCH GOAL 3: run pytest and Ruff on every pull request.
name: Tests and lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.24"
      - name: Install locked dependencies
        run: uv sync --locked --python "${{ matrix.python }}"
      - name: Test
        run: .venv/bin/python -m pytest -q
      - name: Lint
        run: .venv/bin/ruff check .
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t orbit-air-baggage-desk .
      - name: Test image
        run: docker run --rm orbit-air-baggage-desk python -m pytest -q
      - name: Check CLI
        run: docker run --rm orbit-air-baggage-desk python main.py --help
